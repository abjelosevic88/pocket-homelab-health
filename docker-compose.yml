# Pocket Health — your health data at home (Go + SQLite). One container, one volume.
services:
  pocket-health:
    image: ghcr.io/abjelosevic88/pocket-homelab-health:latest
    container_name: pocket-health
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      UNITS: ${UNITS:-metric}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      HABITS_URL: ${HABITS_URL:-}
      HABITS_TOKEN: ${HABITS_TOKEN:-}
      MOVEMENT_URL: ${MOVEMENT_URL:-}
      MOVEMENT_TOKEN: ${MOVEMENT_TOKEN:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
